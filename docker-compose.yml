services:
  collab-server:
    build: .
    image: editor-collaboration-server:latest
    restart: unless-stopped
    ports:
      # Loopback only. For a LAN, publish 0.0.0.0:7878:7878 and keep a real password. For the Internet, stay on
      # loopback and terminate TLS in a reverse proxy (docs/internet.md).
      - "127.0.0.1:7878:7878"
    environment:
      # Required. Every collaborator enters it in Editor Preferences > Plugins > Editor Collaboration (personal).
      # Set it in the shell or a .env file next to this compose file. There is no default.
      COLLAB_PASSWORD: ${COLLAB_PASSWORD:?Set COLLAB_PASSWORD}
      COLLAB_PORT: "7878"
      COLLAB_MAX_ROOM_CLIENTS: "64"
    volumes:
      # Database (collab.db): chat history, comments and modified files.
      - collab-data:/data

volumes:
  collab-data:
