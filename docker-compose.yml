services:
  collab-server-rust:
    build: .
    image: editor-collaboration-server-rust:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${COLLAB_PUBLISHED_PORT:-7878}:7878"
    environment:
      COLLAB_ROOM: ${COLLAB_ROOM:?Set COLLAB_ROOM to the plugin room name}
      COLLAB_PASSWORD: ${COLLAB_PASSWORD:?Set COLLAB_PASSWORD}
      COLLAB_PORT: "7878"
      COLLAB_MAX_ROOM_CLIENTS: "64"
    volumes:
      - collab-rust-data:/data

volumes:
  collab-rust-data:
