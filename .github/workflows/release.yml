name: Rust server

on:
  pull_request:
  push:
    branches: [main]
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.asset }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            asset: collab-server-rust-windows-amd64.exe
            executable: collab-server.exe
          - runner: ubuntu-22.04
            asset: collab-server-rust-linux-amd64
            executable: collab-server
          - runner: ubuntu-22.04-arm
            asset: collab-server-rust-linux-arm64
            executable: collab-server
          - runner: macos-15-intel
            asset: collab-server-rust-darwin-amd64
            executable: collab-server
          - runner: macos-15
            asset: collab-server-rust-darwin-arm64
            executable: collab-server
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Rust stable
        run: rustup update stable --no-self-update
      - name: Run Rust tests
        run: cargo +stable test --locked
      # The standalone checkout has no parent Unreal plugin descriptor.
      - name: Build release binary
        run: cargo +stable build --locked --release --target-dir target
      - name: Run HTTP and WebSocket protocol tests
        shell: bash
        env:
          SERVER_EXE: ${{ matrix.executable }}
        run: |
          python -m pip install websockets==17.4
          python tests/protocol.py "target/release/$SERVER_EXE"
      - name: Package binary
        shell: bash
        env:
          SERVER_EXE: ${{ matrix.executable }}
          ASSET_NAME: ${{ matrix.asset }}
        run: |
          mkdir -p dist
          cp "target/release/$SERVER_EXE" "dist/$ASSET_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: collab-server-rust-*
          path: dist
          merge-multiple: true
      - name: Generate SHA-256 manifest
        working-directory: dist
        shell: bash
        run: sha256sum collab-server-rust-* > SHA256SUMS
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          assets=(dist/collab-server-rust-* dist/SHA256SUMS)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --verify-tag --generate-notes
          fi
